[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

# Avalanche RPC endpoints
[rpc_endpoints]
avax_fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avax_mainnet = "https://api.avax.network/ext/bc/C/rpc"

# Etherscan verification (Snowtrace)
[etherscan]
avax_fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
avax_mainnet = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }
